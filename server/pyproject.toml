[project]
name = "concierge-server"
version = "0.1.0"
description = "Hotel guest engagement & operations platform — Phase 1 server"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic[email]>=2.9",
  "bcrypt>=4.2",
  "flask-sock>=0.7",
  "python-dotenv>=1.0",
  # zoneinfo has no tz database on Windows (and on slim Linux images); the property
  # timezone validator in app/domain/properties.py would otherwise reject every
  # valid IANA zone there.
  "tzdata>=2024.1",
  # flask-sock speaks the protocol but delegates the WSGI handshake to simple-websocket,
  # so /ws is dead without it at runtime. It sat in the dev extra until the container
  # build made the distinction load-bearing.
  "simple-websocket>=1.1",
  # Production WSGI server. run.py's docstring has named this command since the server
  # phase; it was never actually installable.
  "gunicorn>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "seed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
